services:
  fitfuel-app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: fitfuel-app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: 3000
      NODE_ENV: production
    volumes:
      - ../data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: fitfuel-caddy
    restart: unless-stopped
    depends_on:
      - fitfuel-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
